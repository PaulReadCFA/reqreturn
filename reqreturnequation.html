<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Equation 21 | Required Return | CFA Institute</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="cfa-base.css" />
  <link rel="stylesheet" href="required-return-specific.css" />

  <style>
    body {
      background: #ffffff;
      padding: 0.5rem 1rem;
      margin: 0;
    }

    .container {
      padding: 0;
    }

    .content {
      gap: 0;
    }

    #static-equation-card {
      box-shadow: none;
      border: none;
      padding: 0.5rem 0;
    }

    .equation-container {
      margin: 0;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      text-align: center;
    }

    .equation-container math {
      display: inline-block;
      font-family: "STIX Two Math", "Cambria Math", "Latin Modern Math", serif;
      font-size: 1.1rem;
      font-weight: 600;
      min-width: max-content;
    }
  </style>

  <script type="text/x-mathjax-config">
    MathJax.Hub.Config({
      MathML: {
        extensions: ["content-mathml.js"]
      },
      "HTML-CSS": {
        scale: 100,
        linebreaks: { automatic: true }
      },
      showProcessingMessages: false,
      messageStyle: "none",
      menuSettings: { explorer: true },
      skipStartupTypeset: false
    });

    function removeMathJaxTabindex() {
      document.querySelectorAll("[tabindex]").forEach(function (el) {
        /* Keep MathJax's accessible interaction inside the formula card. */
        if (el.closest && el.closest(".formula-equation-card")) return;
        if (el.classList.contains("MathJax") ||
            el.classList.contains("MathJax_Display") ||
            (el.id && el.id.indexOf("MathJax-") === 0) ||
            el.tagName === "MATH" ||
            (el.closest && el.closest(".MathJax"))) {
          el.removeAttribute("tabindex");
        }
      });
    }

    MathJax.Hub.Register.StartupHook("End", function () {
      removeMathJaxTabindex();
      setTimeout(removeMathJaxTabindex, 100);
      setTimeout(removeMathJaxTabindex, 500);
      setTimeout(removeMathJaxTabindex, 1000);
    });
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/MathJax.js?config=MML_HTMLorMML"></script>
</head>
<body>
  <div class="container">
    <main class="content">
      <section id="static-equation-card" class="card formula-equation-card"
               role="region" aria-label="Required return equation">
        <div class="equation-container">
          <math xmlns="http://www.w3.org/1998/Math/MathML" display="block">
            <mrow>
              <mi mathcolor="#7A46FF">r</mi>
              <mo>=</mo>
              <mfrac>
                <mrow>
                  <msub>
                    <mi mathcolor="#3c6ae5">Div</mi>
                    <mi>t</mi>
                  </msub>
                  <mrow>
                    <mo>(</mo>
                    <mn>1</mn>
                    <mo>+</mo>
                    <mi mathcolor="#07514F">g</mi>
                    <mo>)</mo>
                  </mrow>
                </mrow>
                <msub>
                  <mi mathcolor="#b95b1d">PV</mi>
                  <mi>t</mi>
                </msub>
              </mfrac>
              <mo>+</mo>
              <mi mathcolor="#07514F">g</mi>
              <mo>=</mo>
              <mfrac>
                <msub>
                  <mi mathcolor="#3c6ae5">Div</mi>
                  <mrow>
                    <mi>t</mi>
                    <mo>+</mo>
                    <mn>1</mn>
                  </mrow>
                </msub>
                <msub>
                  <mi mathcolor="#b95b1d">PV</mi>
                  <mi>t</mi>
                </msub>
              </mfrac>
              <mo>+</mo>
              <mi mathcolor="#07514F">g</mi>
            </mrow>
          </math>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
